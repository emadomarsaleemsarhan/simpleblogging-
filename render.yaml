services:
  - type: web
    name: blog-publisher
    runtime: node
    plan: free
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: blog-publisher-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/dev.db
      - key: BLOG_PUBLISHER_STORAGE_ROOT
        value: /var/data/storage
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
