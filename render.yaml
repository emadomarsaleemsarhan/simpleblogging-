services:
  - type: web
    name: blog-publisher
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: blog-publisher-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blog-publisher-db
          property: connectionString
      - key: BLOG_PUBLISHER_STORAGE_ROOT
        value: /var/data/storage
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true

databases:
  - name: blog-publisher-db
    plan: free
    databaseName: blog_publisher
    user: blog_publisher
